<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1117" />
    <meta name="description" content="A simple mobile-friendly songbook for rehearsals and gigs." />
    <title>Gig Songbook</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Song navigation">
        <div class="sidebar__header">
          <div>
            <p class="eyebrow">GIG SONGBOOK</p>
            <h1>SONGS</h1>
          </div>
          <button class="icon-button sidebar__close" id="closeMenu" type="button" aria-label="Collapse song menu">×</button>
        </div>

        <label class="search">
          <span class="sr-only">Search songs</span>
          <input id="searchInput" type="search" placeholder="Search songs…" autocomplete="off" />
        </label>

        <nav id="songNav" class="song-nav" aria-label="Songs"></nav>

        <div class="sidebar__footer">
          <span id="songCount">0 songs</span>
          <span>Markdown powered</span>
        </div>
      </aside>

      <div class="backdrop" id="backdrop" hidden></div>

      <main class="main">
        <header class="toolbar">
          <button class="button button--menu" id="menuToggle" type="button" aria-label="Toggle song menu">☰ <span>SONGS</span></button>

          <button class="language-toggle" id="languageToggle" type="button" aria-label="Afficher la version française">
            <span class="language-toggle__label is-active" id="originalLabel">ORIGINAL</span>
            <span class="language-toggle__divider" aria-hidden="true">⇄</span>
            <span class="language-toggle__label" id="frenchLabel">FR</span>
          </button>

          <div class="toolbar__spacer"></div>
          <button class="button button--compact" id="fontDown" type="button" aria-label="Decrease lyrics font size">A−</button>
          <button class="button button--compact" id="fontUp" type="button" aria-label="Increase lyrics font size">A+</button>
          <button class="button button--compact" id="wakeLock" type="button" aria-pressed="false" title="Keep the screen awake">☀</button>
        </header>

        <article class="lyrics" id="lyrics" aria-live="polite">
          <div class="empty-state">
            <p class="eyebrow">READY WHEN YOU ARE</p>
            <h2>SELECT A SONG</h2>
            <p>Pick a song from the menu. Switch between the original lyrics and the French adaptation at any time.</p>
          </div>
        </article>

        <footer class="pager" id="pager" hidden>
          <button class="pager__button" id="previousSong" type="button">← <span>PREVIOUS</span></button>
          <span class="pager__position" id="pagerPosition"></span>
          <button class="pager__button" id="nextSong" type="button"><span>NEXT</span> →</button>
        </footer>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
